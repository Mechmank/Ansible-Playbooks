---
- name: Disk space check
  hosts: all
  gather_facts: false
  tasks:

    - name: Remove the old output file (once)
      file:
        path: /root/ansible/outputs/disk_space.csv
        state: absent
      delegate_to: localhost
      run_once: true

    - name: Get used % of all mounts in one line
      shell: |
        df -hP -x tmpfs -x devtmpfs -x squashfs -x iso9660 -x overlay | awk 'NR>1 {s = s (s ? ", " : "") $6 "=" $5} END {print s}'
      register: df_out

    - name: Exporting output (one row per host)
      export_out:
        input:
          - "{{ inventory_hostname }}"
          - "{{ df_out.stdout }}"
        output: disk_space
      delegate_to: localhost
