---
- name: Install Windows updates (same as Settings > Windows Update)
  hosts: windows
  gather_facts: false
  serial: 1                      # one server at a time
  tasks:

    - name: Start Windows Update service
      win_service:
        name: wuauserv
        start_mode: manual
        state: started

    - name: Install all available updates
      win_updates:
        category_names: "*"
        server_selection: windows_update
        state: installed
        reboot: true
        reboot_timeout: 3600
      register: patch_result
      
    - name: Stop the Windows Update service
      win_service:
        name: wuauserv
        start_mode: disabled
        state: stopped

    - name: Build output row
      set_fact:
        details:
          - "{{ inventory_hostname }}"
          - "{{ patch_result.installed_update_count }}"
          - "{{ patch_result.failed_update_count }}"
          - "{{ patch_result.reboot_required }}"

    - name: Exporting output
      export_out:
        input: "{{ details }}"
        output: windows_patch
      delegate_to: localhost
