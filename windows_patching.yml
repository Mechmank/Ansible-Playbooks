---
- name: Install Windows updates (same as Settings > Windows Update)
  hosts: windows
  gather_facts: false
  serial: 1                      # one server at a time
  tasks:

    - name: Ping check
      ansible.windows.win_ping:

    - name: Make sure the Windows Update service is not disabled
      ansible.windows.win_service:
        name: wuauserv
        start_mode: manual
        state: started

    - name: Install all available updates
      ansible.windows.win_updates:
        category_names: "*"                    # all categories
        server_selection: windows_update       # use Windows Update directly, not WSUS
        state: installed
        reboot: true
        reboot_timeout: 3600
        log_path: C:\Temp\win_updates.log
      register: patch_result

    - name: Patch summary
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} : {{ patch_result.installed_update_count }} installed,
          {{ patch_result.failed_update_count }} failed,
          reboot required: {{ patch_result.reboot_required }}
